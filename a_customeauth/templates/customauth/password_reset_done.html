{% extends "base/base.html" %}

{% block title %}Password Reset Sent{% endblock %}

{% block body %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white shadow rounded-lg p-8 text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Check Your Email</h1>
        <p class="text-sm text-gray-500 mb-6">
            If an account exists with the email you provided, we've sent a password reset link.
            Please check your inbox and spam folder.
        </p>
        <a href="{% url 'auth_login' %}" class="text-primary-600 hover:text-primary-800 text-sm font-medium">Return to login</a>
    </div>
</div>
{% endblock %}
