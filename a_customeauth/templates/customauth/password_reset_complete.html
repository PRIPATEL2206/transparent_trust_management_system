{% extends "base/base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block body %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white shadow rounded-lg p-8 text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Password Reset Successful</h1>
        <p class="text-sm text-gray-500 mb-6">Your password has been reset. You can now log in with your new password.</p>
        <a href="{% url 'auth_login' %}" class="inline-block bg-primary-600 text-white px-6 py-2 rounded-md hover:bg-primary-700 font-medium">
            Log In
        </a>
    </div>
</div>
{% endblock %}
