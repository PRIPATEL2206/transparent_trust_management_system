{% extends "base/base.html" %}

{% block title %}Reset Password{% endblock %}

{% block body %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white shadow rounded-lg p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Reset Your Password</h1>
        <p class="text-sm text-gray-500 mb-6">Enter your email address and we'll send you a link to reset your password.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" name="email" id="id_email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-primary-500 focus:border-primary-500">
            </div>
            <button type="submit" class="w-full bg-primary-600 text-white px-4 py-2 rounded-md hover:bg-primary-700 font-medium">
                Send Reset Link
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="{% url 'auth_login' %}" class="text-sm text-primary-600 hover:text-primary-800">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
