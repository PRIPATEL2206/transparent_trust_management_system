{% if breadcrumbs %}
<nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3" aria-label="Breadcrumb">
    <ol class="flex items-center space-x-2 text-sm text-gray-500">
        <li>
            <a href="/" class="hover:text-gray-700">Home</a>
        </li>
        {% for crumb in breadcrumbs %}
        <li class="flex items-center">
            <svg class="w-4 h-4 text-gray-300 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
            {% if crumb.url %}
            <a href="{{ crumb.url }}" class="hover:text-gray-700">{{ crumb.label }}</a>
            {% else %}
            <span class="text-gray-900 font-medium">{{ crumb.label }}</span>
            {% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>
{% endif %}
