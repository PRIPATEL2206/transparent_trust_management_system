{% extends "base/base.html" %}

{% block title %}Assign Role{% endblock %}

{% block body %}
<div class="max-w-lg mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Assign Role to {{ target_user.username }}</h1>

    <div class="bg-white shadow rounded-lg p-6">
        <p class="text-sm text-gray-600 mb-4">Current Role: <strong>{{ current_role }}</strong></p>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">New Role</label>
                <select name="role" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500">
                    {% for value, label in role_choices %}
                    <option value="{{ value }}" {% if value == current_role %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="bg-primary-600 text-white px-4 py-2 rounded-md hover:bg-primary-700">
                    Assign Role
                </button>
                <a href="{% url 'roles_list' %}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-400">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
