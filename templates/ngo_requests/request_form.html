{% extends "base/base.html" %}

{% block title %}Request Funding{% endblock %}

{% block body %}
<div class="max-w-lg mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Request Funding</h1>

    <div class="bg-white shadow rounded-lg p-6">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {% include "base/form_errors.html" %}
            {% for field in form %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="w-full bg-primary-600 text-white px-4 py-2 rounded-md hover:bg-primary-700">
                Submit Request
            </button>
        </form>
    </div>
</div>
{% endblock %}
