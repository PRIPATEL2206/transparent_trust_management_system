[pytest]
DJANGO_SETTINGS_MODULE = a_core.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short -q
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external services

[coverage:run]
source = a_customeauth,donations,expenses,roles,notices,payments,products,ngo_requests,dashboard,approval_engine,services
omit =
    */migrations/*
    */tests/*
    manage.py

[coverage:report]
fail_under = 60
show_missing = true
skip_covered = true
